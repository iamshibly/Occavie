# Production profile (SPRING_PROFILES_ACTIVE=prod). Safe defaults for a public deployment.

# Behind a reverse proxy (Render, etc.): trust X-Forwarded-* from the platform proxy so scheme and client IP are right.
server.forward-headers-strategy=native

# Session and cookie hardening
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Public demo conveniences are OFF in production
occavie.demo-access.enabled=false
occavie.demo-seed.enabled=false
occavie.password-reset.demo-mode=false

# Templates are cached; error pages never leak internals
spring.thymeleaf.cache=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Static assets: long cache for fingerprinted/versioned files
spring.web.resources.cache.cachecontrol.max-age=30d
