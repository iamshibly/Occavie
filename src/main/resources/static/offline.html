<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Offline · Occavie</title>
<style>
*{box-sizing:border-box}
html{overflow-x:hidden;max-width:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;color:#fff;text-align:center;padding:24px;background:linear-gradient(135deg,#0B1530,#14305A 60%,#3a2a05);overflow:hidden;position:relative}
body::before,body::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 12s ease-in-out infinite alternate}
body::before{width:340px;height:340px;left:-40px;top:8%;background:#E5AD1C}
body::after{width:300px;height:300px;right:-40px;bottom:-40px;background:#3B5BDB;animation-delay:-5s}
@keyframes drift{to{transform:translate(60px,-40px) scale(1.15)}}
main{position:relative;z-index:1;width:min(480px,100%);padding:36px 28px;border-radius:28px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(14px);box-shadow:0 28px 70px rgba(0,0,0,.4)}
.ic{width:76px;height:76px;margin:0 auto 16px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(135deg,#E5AD1C,#D19208);color:#0B1530;font-size:2rem;font-weight:800;box-shadow:0 10px 24px rgba(209,146,8,.45)}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:2rem;margin:0 0 10px;line-height:1.1}
p{margin:0 0 22px;color:rgba(255,255,255,.88);line-height:1.55}
a{display:inline-flex;align-items:center;min-height:50px;padding:0 28px;background:linear-gradient(135deg,#E5AD1C,#D19208);color:#0B1530;border-radius:999px;text-decoration:none;font-weight:800}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
</style></head>
<body><main><div class="ic" aria-hidden="true">!</div><h1>You are offline</h1><p>Occavie needs a connection to search events, book tickets or check in attendees. Nothing was submitted. Reconnect and try again.</p><a href="/">Try again</a></main></body></html>
