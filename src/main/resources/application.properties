spring.application.name=occavie

# Render provides PORT automatically. Local development falls back to 8080.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.whitelabel.enabled=false

# MongoDB Atlas. MONGODB_URI must be supplied as an environment variable.
# The default database name intentionally stays "eventflow" so existing data keeps working after the Occavie rebrand.
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:eventflow}
spring.data.mongodb.auto-index-creation=true

# Public demo accounts are seeded automatically by DataInitializer.
# Their credentials are intentionally shown on the login page for this university/demo project.
# OCCAVIE_REMEMBER_KEY is preferred; the legacy EVENTFLOW_REMEMBER_KEY is still honoured.
occavie.security.remember-key=${OCCAVIE_REMEMBER_KEY:${EVENTFLOW_REMEMBER_KEY:occavie-local-remember-key}}

# Keep false while developing. Set THYMELEAF_CACHE=true on deployment for faster template rendering.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Small in-memory cache for event lists and repeated registration counts.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=300,expireAfterWrite=2m

# Compress text responses sent to the browser.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml

# Let the browser reuse CSS, JavaScript, icons and other static files.
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.cache=true

# Uploaded event images are kept separately in MongoDB so event-list queries stay lightweight.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB


# ---- Email (transactional, optional). Secrets come from the environment, never from this file.
#   OCCAVIE_EMAIL_PROVIDER=resend   RESEND_API_KEY=re_...   OCCAVIE_EMAIL_FROM="Occavie <events@your-domain>"
occavie.email.provider=${OCCAVIE_EMAIL_PROVIDER:none}
occavie.email.api-key=${RESEND_API_KEY:}
occavie.email.from=${OCCAVIE_EMAIL_FROM:}
# Absolute site URL used for links inside emails (emails are built outside a web request).
occavie.public-base-url=${OCCAVIE_PUBLIC_URL:http://localhost:8080}

# ---- Background work. State lives in MongoDB (email outbox, dedupe keys), so a restart loses nothing.
# The in-process poller runs while the app is awake; external schedulers can call POST /internal/jobs/run
# with header X-Jobs-Token (set OCCAVIE_JOBS_TOKEN; the endpoint is disabled when it is empty).
occavie.jobs.token=${OCCAVIE_JOBS_TOKEN:}
occavie.jobs.poll-ms=${OCCAVIE_JOBS_POLL_MS:60000}
occavie.reminder.hours-before=${OCCAVIE_REMINDER_HOURS:24}

# ---- Event approval workflow (off by default = existing publish behaviour)
occavie.approval.required=${OCCAVIE_APPROVAL_REQUIRED:false}
occavie.event-timezone=${OCCAVIE_EVENT_TIMEZONE:Asia/Dhaka}
occavie.ticket.secret=${OCCAVIE_TICKET_SECRET:${OCCAVIE_REMEMBER_KEY:${EVENTFLOW_REMEMBER_KEY:occavie-local-remember-key}}}

# ---- Sessions, cookies and errors (defaults; the prod profile tightens them further)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
server.error.include-message=never
server.error.include-stacktrace=never
occavie.ratelimit.enabled=true
occavie.password-reset.demo-mode=false

# Content-hashed static URLs (/css/occavie-core-<hash>.css): a changed file always gets a new URL, so a deploy can never be
# shadowed by a stale browser/CDN copy. Applies to links written with th:href/th:src="@{...}".
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/images/**

# Public details (set these in the host's environment; the repository contains no personal contact data)
occavie.developer.name=${OCCAVIE_DEVELOPER_NAME:Md. Zubayer Ahmad Shibly}
occavie.developer.url=${OCCAVIE_DEVELOPER_URL:https://github.com/iamshibly}
occavie.contact.email=${OCCAVIE_CONTACT_EMAIL:}
occavie.contact.whatsapp=${OCCAVIE_CONTACT_WHATSAPP:8801845250202}
occavie.contact.address=${OCCAVIE_CONTACT_ADDRESS:Dhaka, Bangladesh}
# Loads ~54 sample events into a completely empty database (never touches existing data)
occavie.sample-events.enabled=${OCCAVIE_SAMPLE_EVENTS:false}
occavie.developer.facebook=${OCCAVIE_DEVELOPER_FACEBOOK:https://www.facebook.com/ahmadkhan.saber}
occavie.developer.linkedin=${OCCAVIE_DEVELOPER_LINKEDIN:https://www.linkedin.com/in/iamshibly/}
