<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Access Denied', 'public')}"></head>
<body class="ov-page ov-err-page">
<a class="skip-link" href="#main-content">Skip to content</a>
<div th:replace="~{fragments :: siteNav('')}"></div>
<main class="ov-auth-scene ov-err-scene" id="main-content">
  <div class="ov-auth-bg" aria-hidden="true">
    <span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span><span class="s5"></span>
    <i class="orb o1"></i><i class="orb o2"></i>
  </div>
  <div class="ov-container ov-err-wrap">
    <section class="ov-err-card" aria-labelledby="errTitle">
      <p class="ov-err-code" aria-hidden="true">403</p>
      <div class="ov-err-icon" aria-hidden="true"><i class="bi bi-shield-lock"></i></div>
      <span class="ov-eyebrow">403 ACCESS DENIED</span>
      <h1 id="errTitle">This page is not available for your role.</h1>
      <p>Occavie protects Admin, Organizer and Participant areas separately. Use your dashboard to continue.</p>
      <div class="ov-err-actions"><a class="ov-gold-button ov-auth-submit" th:href="@{/dashboard}"><i class="bi bi-grid-1x2" aria-hidden="true"></i> Back to dashboard</a><a class="ov-outline-button" th:href="@{/home}"><i class="bi bi-house" aria-hidden="true"></i> Home</a></div>
    </section>
  </div>
</main>
<div th:replace="~{fragments :: siteFooter}"></div>
<script th:src="@{/js/site.js(v='2026.11.5')}" src="/js/site.js"></script>
</body>
</html>
