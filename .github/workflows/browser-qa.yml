name: Occavie browser smoke QA

on:
  push:
    branches:
      - qa-browser-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Configure Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser testing tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
          python -m py_compile scripts/qa_browser_smoke.py

      - name: Build the actual Spring Boot website
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package

      - name: Start isolated Occavie test app with disposable MongoDB
        run: |
          MONGODB_URI=mongodb://127.0.0.1:27017/occavie_qa?retryWrites=false \
          MONGODB_DATABASE=occavie_qa \
          OCCAVIE_SAMPLE_EVENTS=true \
          java -jar target/eventflow-0.0.1-SNAPSHOT.jar > qa-app.log 2>&1 &
          echo $! > qa-app.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then
              echo "Isolated app is ready"
              exit 0
            fi
            sleep 2
          done
          tail -150 qa-app.log
          exit 1

      - name: Exercise public and all three role dashboards in Chromium
        env:
          QA_BASE_URL: http://127.0.0.1:8080
          QA_OUTPUT_DIR: qa-output
        run: python scripts/qa_browser_smoke.py

      - name: Run existing Java JUnit suite against disposable MongoDB
        if: always()
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/occavie_qa?retryWrites=false
          MONGODB_DATABASE: occavie_qa
        run: ./mvnw -B test

      - name: Run existing JavaScript unit tests
        if: always()
        run: node --test src/test/js/*.test.js

      - name: Read-only Chromium audit of deployed Render public pages
        if: always()
        continue-on-error: true
        env:
          QA_BASE_URL: https://occavie.onrender.com
          QA_PUBLIC_ONLY: '1'
          QA_OUTPUT_DIR: qa-output-production
        run: python scripts/qa_browser_smoke.py

      - name: Archive QA report, screenshots and Spring logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-report
          if-no-files-found: warn
          retention-days: 14
          path: |
            qa-output/
            qa-output-production/
            target/surefire-reports/
            qa-app.log
